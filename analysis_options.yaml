include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # Generated by flutter_rust_bridge and freezed: a regenerate must never trip a lint.
    - lib/src/rust/**
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Async
    - unawaited_futures
    - unnecessary_await_in_return
    - avoid_void_async
    # Types and safety
    - always_declare_return_types
    - avoid_dynamic_calls
    - type_annotate_public_apis
    - only_throw_errors
    - cancel_subscriptions
    - close_sinks
    # Style
    - prefer_single_quotes
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - directives_ordering
    - unnecessary_lambdas
    - sort_pub_dependencies
    - use_super_parameters
