# CI/CD for gogdl_flutter. Runs on the self-hosted runner on thinkcentre.home (Docker
# executor), same setup as lumen's .gitlab-ci.yml. See v1.2.0-FOUNDATION.md Phases 5 and 6:
# the `check` stage gates everything, and the `release` stage publishes a GitLab release on
# vX.Y.Z tags.
#
# `gogdl-lib` is a private git dependency reachable only over the LAN
# (ssh://git@thinkcentre.home:2200). cargo fetches it through the git CLI
# (CARGO_NET_GIT_FETCH_WITH_CLI) so it can use the ssh-agent, which is loaded with a
# read-only deploy key stored base64-encoded (single line, no whitespace) as the
# `GOGDL_LIB_DEPLOY_KEY_B64` variable (Settings -> CI/CD -> Variables in this project,
# Type: Variable, masked, NOT protected: a protected variable comes through empty on
# unprotected branches). Its public half must be added as a deploy key on the gogdl-lib
# project.
#
# Jobs run in a prebuilt image (ci/Dockerfile: apt packages, rustup `stable`, the frb codegen
# and Flutter), so none of them touches apt, rustup or the Flutter clone: the network is slow
# and the runner is small. The runner is a container with its own docker-in-docker daemon, so
# build the image on the host and load it there: `ci/build-image.sh --load-into <container>`.
# Rebuild it after bumping .fvmrc or the frb version (update `image:` below to the printed
# name; the `.toolchain` check fails a job whose image has a stale Flutter). The runner's
# config.toml must not force pulls, under [runners.docker]:
#   pull_policy = ["if-not-present"]
# (or allowed_pull_policies including it), then restart the runner.
#
# If a job fails to resolve thinkcentre.home, the runner's containers aren't seeing the LAN's
# /etc/hosts entry (it's a hosts-file entry, not real DNS). Fix it in
# /etc/gitlab-runner/config.toml under [runners.docker]:
#   extra_hosts = ["thinkcentre.home:192.168.8.234"]
# then restart the runner (`sudo gitlab-runner restart`).

# Pipelines run only for tag pushes (e.g. v1.2.0) and for manual runs from the web UI
# (Build -> Pipelines -> Run pipeline) on any branch, to keep load off the self-hosted runner.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check
  - release

default:
  image:
    name: gogdl-flutter-ci:flutter-3.47.2-frb-2.13.0
    pull_policy: if-not-present

# Everything that gets cached must live inside the project dir. The toolchains are in the image
# (/opt/cargo/bin, /opt/flutter/bin are on PATH); only the download caches are relocated here.
# CARGO_HOME only holds cargo's registry and git downloads here; the rustup proxies and the
# codegen binary are found through PATH, and the toolchain through the image's RUSTUP_HOME.
variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.ci/pub-cache"
  CARGO_HOME: "$CI_PROJECT_DIR/.ci/cargo"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

# SSH access to gogdl-lib via the base64-encoded deploy key variable.
.ssh:
  script:
    - mkdir -p ~/.ssh
    - echo "$GOGDL_LIB_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/gogdl_deploy_key
    - chmod 600 ~/.ssh/gogdl_deploy_key
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/gogdl_deploy_key
    - ssh-keyscan -p 2200 thinkcentre.home >> ~/.ssh/known_hosts 2>/dev/null

# Fails when the image's Flutter isn't the one pinned in .fvmrc, which would otherwise be
# tested against the old Flutter without any error. (A literal block, not a plain list-item
# string: the sed script's `": *"` would otherwise parse as a YAML mapping value.)
.toolchain:
  script:
    - |
      want=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)
      have=$(cat /opt/flutter-version)
      if [ "$want" != "$have" ]; then
        echo "CI image has Flutter $have but .fvmrc pins $want: rebuild it with ci/build-image.sh and update image: in .gitlab-ci.yml" >&2
        exit 1
      fi
    - rustc --version
    - flutter --version

.cache-flutter: &cache-flutter
  key:
    prefix: flutter
    files:
      - .fvmrc
      - pubspec.yaml
  paths:
    - .ci/pub-cache/

.cache-cargo: &cache-cargo
  key:
    prefix: cargo
    files:
      - rust/Cargo.lock
  paths:
    - .ci/cargo/registry/
    - .ci/cargo/git/

.cache-target: &cache-target
  key:
    prefix: target-$CI_JOB_NAME
    files:
      - rust/Cargo.lock
  paths:
    - rust/target/

rust:
  stage: check
  cache:
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.ssh, script]
    - !reference [.toolchain, script]
  script:
    - cd rust
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked

dart:
  stage: check
  cache:
    - *cache-flutter
  before_script:
    - !reference [.toolchain, script]
  script:
    - flutter pub get
    - flutter analyze --fatal-infos
    - cd example
    - flutter pub get
    - flutter analyze --fatal-infos

# Regenerates the bindings and fails if anything differs. build_runner runs explicitly
# afterwards because codegen's own pass can delete the *.freezed.dart files without rewriting
# them (see Phase 4).
codegen:
  stage: check
  cache:
    - *cache-flutter
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.ssh, script]
    - !reference [.toolchain, script]
  script:
    - flutter pub get
    - flutter_rust_bridge_codegen generate
    - dart run build_runner build --delete-conflicting-outputs
    - git status --porcelain
    - git diff --exit-code
    - test -z "$(git status --porcelain)"

# Builds the example for Linux (cargokit compiles the plugin) and runs the integration test
# on a virtual display.
integration:
  stage: check
  cache:
    - *cache-flutter
    - *cache-cargo
  before_script:
    - !reference [.ssh, script]
    - !reference [.toolchain, script]
  script:
    - cd example
    - flutter pub get
    - xvfb-run -a flutter test integration_test -d linux

# Runs after all check jobs, on vX.Y.Z tags only. tool/release_notes.sh fails if pubspec.yaml,
# rust/Cargo.toml and the tag disagree, or if CHANGELOG.md has no section for the version, so a
# tag can't ship without matching versions and notes. The release uses CI_JOB_TOKEN.
release:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:latest
    pull_policy: if-not-present
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache: []
  script:
    - sh tool/release_notes.sh "$CI_COMMIT_TAG" > release_notes.md
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release_notes.md
