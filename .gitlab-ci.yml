# CI/CD for gogdl_flutter. Runs on the self-hosted runner on thinkcentre.home (Docker
# executor), same setup as lumen's .gitlab-ci.yml. See devlog/v1.2.0-foundation.md (Phases 5
# and 6): the `check` stage gates everything, and the `release` stage publishes a GitLab
# release on vX.Y.Z tags.
#
# `gogdl-lib` is a git dependency fetched from its public GitHub mirror over HTTPS
# (https://github.com/fernando-navarrete/gogdl-lib), as a fresh clone of this repo fetches it: no
# key, no ssh and no git CLI, so CI proves that a clone builds anywhere.
#
# Jobs run in a prebuilt image (ci/Dockerfile: apt packages, the pinned rustup toolchain, the frb codegen
# and Flutter), so none of them touches apt, rustup or the Flutter clone: the network is slow
# and the runner is small. The runner shares the host's docker through its mounted docker.sock,
# so the image is built on the host with `ci/build-image.sh` and jobs see it directly. Rebuild
# it after bumping .fvmrc, rust/rust-toolchain.toml or the frb version (bump `constraints` in
# renovate.json with them), or after changing ci/Dockerfile with a bumped IMAGE_REVISION (update `image:` below to the printed name; the
# `.toolchain` check fails a job whose image has a stale Flutter or Rust). The runner's config.toml
# (volume `gitlab-runner-config`) must not force pulls, under [runners.docker]:
#   pull_policy = ["if-not-present"]
# (or allowed_pull_policies including it), then `docker service update --force gitlab-runner`.
#
# If a job fails to resolve thinkcentre.home, the runner's containers aren't seeing the LAN's
# /etc/hosts entry (it's a hosts-file entry, not real DNS). Fix it in
# /etc/gitlab-runner/config.toml under [runners.docker]:
#   extra_hosts = ["thinkcentre.home:192.168.8.234"]
# then restart the runner (`sudo gitlab-runner restart`).

# Pipelines run on merge requests, on main, on vX.Y.Z tags and on manual runs from the web UI
# (Build -> Pipelines -> Run pipeline, any branch). A branch with an open MR runs only the MR
# pipeline, and a pushed branch without an MR runs nothing. A scheduled pipeline runs only the jobs
# that name its SCHEDULE: the "Weekly scan" schedule on main (CI/CD -> Schedules, SCHEDULE=scan) runs
# `audit` and `scan`, so an advisory published after a dependency landed is noticed. The "Renovate"
# schedule on main (SCHEDULE=renovate) runs only `renovate`.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # the MR pipeline covers it: no duplicate branch pipeline
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - check
  - release

default:
  interruptible: true # with "Auto-cancel redundant pipelines" on, a new push cancels the older run
  image:
    name: gogdl-flutter-ci:flutter-3.47.2-rust-1.98.1-frb-2.13.0-r2
    pull_policy: if-not-present

# Everything that gets cached must live inside the project dir. The toolchains are in the image
# (/opt/cargo/bin, /opt/flutter/bin are on PATH); only the download caches are relocated here.
# CARGO_HOME only holds cargo's registry and git downloads here; the rustup proxies and the
# codegen binary are found through PATH, and the toolchain through the image's RUSTUP_HOME.
variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.ci/pub-cache"
  CARGO_HOME: "$CI_PROJECT_DIR/.ci/cargo"
  CARGO_TERM_COLOR: always

# The Native Assets build hook runs cargo with a stripped environment (only HOME and PATH get
# through), so CARGO_HOME and RUSTUP_HOME above don't reach it. Point ~/.cargo and ~/.rustup at the
# same (cached) places instead.
.cargo-home:
  script:
    - mkdir -p ~/.cargo "$CARGO_HOME/registry" "$CARGO_HOME/git"
    - ln -sfn "$CARGO_HOME/registry" ~/.cargo/registry
    - ln -sfn "$CARGO_HOME/git" ~/.cargo/git
    - ln -sfn /opt/rustup ~/.rustup

# Fails when the image's Flutter or Rust isn't the one pinned in .fvmrc / rust/rust-toolchain.toml,
# which would otherwise be tested against the old toolchain without any error (for Rust, the
# build hook would even download the pinned one on every run). (A literal block, not a plain
# list-item string: the sed script's `": *"` would otherwise parse as a YAML mapping value.)
.toolchain:
  script:
    - |
      want=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)
      have=$(cat /opt/flutter-version)
      if [ "$want" != "$have" ]; then
        echo "CI image has Flutter $have but .fvmrc pins $want: rebuild it with ci/build-image.sh and update image: in .gitlab-ci.yml" >&2
        exit 1
      fi
      want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust/rust-toolchain.toml)
      have=$(cat /opt/rust-version)
      if [ "$want" != "$have" ]; then
        echo "CI image has Rust $have but rust/rust-toolchain.toml pins $want: rebuild it with ci/build-image.sh and update image: in .gitlab-ci.yml" >&2
        exit 1
      fi
    - rustc --version
    - flutter --version

# Rules shared by the check jobs: everything except scheduled pipelines.
.not-scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.cache-flutter: &cache-flutter
  key:
    prefix: flutter
    files:
      - .fvmrc
      - pubspec.yaml
  paths:
    - .ci/pub-cache/

.cache-cargo: &cache-cargo
  key:
    prefix: cargo
    files:
      - rust/Cargo.lock
  paths:
    - .ci/cargo/registry/
    - .ci/cargo/git/

.cache-hook-target: &cache-hook-target
  key:
    prefix: hook-target
    files:
      - rust/Cargo.lock
  paths:
    - example/.dart_tool/hooks_runner/shared/gogdl_flutter/build/

.cache-target: &cache-target
  key:
    prefix: target-$CI_JOB_NAME
    files:
      - rust/Cargo.lock
  paths:
    - rust/target/

rust:
  stage: check
  rules: !reference [.not-scheduled, rules]
  cache:
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.cargo-home, script]
    - !reference [.toolchain, script]
  script:
    - cd rust
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked

# RustSec advisories, sources (crates.io plus gogdl-lib), licenses and duplicate versions, per
# rust/deny.toml. cargo-deny is baked into the image (ci/Dockerfile). It reads the metadata of every
# crate, so gogdl-lib is fetched (from GitHub). Its advisory database lands under CARGO_HOME, so it is
# cached; each run then fetches only the new advisories.
audit:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "scan"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  cache:
    - *cache-cargo
    - key: advisory-db
      paths:
        - .ci/cargo/advisory-dbs/
  before_script:
    - !reference [.cargo-home, script]
    - !reference [.toolchain, script]
  script:
    - cd rust
    - cargo deny --locked check

# OSV-Scanner on both lock files, minus the accepted findings in osv-scanner.toml (each with a reason
# and an ignoreUntil date). On rust/Cargo.lock only a known-malicious crate (MAL-) fails it: audit
# gates the RustSec advisories through deny.toml, so the rest is only printed. On example/pubspec.lock
# any advisory fails it, since nothing else gates pub packages. Two scanner runs, one per lock file,
# so the exit code tells them apart: the image has no jq or dart to split one report. Exit codes above
# 1 are scanner or network errors and fail either way. Only lock files are read: no git fetch, no toolchain.
scan:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "scan"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  image:
    name: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    entrypoint: [''] # the binary is /osv-scanner, not on PATH; the image has /bin/sh
    pull_policy: if-not-present
  cache: []
  before_script: []
  script:
    - |
      rc=0
      /osv-scanner scan --config osv-scanner.toml --lockfile rust/Cargo.lock \
        --format json --output-file osv-cargo.json || rc=$?
      [ "$rc" -le 1 ] || exit "$rc"
      grep -o '"\(MAL\|RUSTSEC\|GHSA\|CVE\)-[^"]*"' osv-cargo.json | sort -u || true # what OSV found, for the log
      n=$(grep -o '"\(RUSTSEC\|GHSA\|CVE\)-[^"]*"' osv-cargo.json | sort -u | wc -l || true)
      echo "rust/Cargo.lock: $n non-malicious advisory ids above, not gating here (audit gates them via deny.toml)"
      if grep -q '"MAL-' osv-cargo.json; then echo "Known-malicious crate in rust/Cargo.lock" >&2; exit 1; fi
    - |
      rc=0
      /osv-scanner scan --config osv-scanner.toml --lockfile example/pubspec.lock \
        --format json --output-file osv-pub.json || rc=$?
      [ "$rc" -le 1 ] || exit "$rc"
      grep -o '"\(MAL\|GHSA\|CVE\)-[^"]*"' osv-pub.json | sort -u || true # what OSV found, for the log
      if [ "$rc" -eq 1 ]; then
        echo "Advisory for a package in example/pubspec.lock: bump it, or accept it in osv-scanner.toml" >&2
        exit 1
      fi
      echo "example/pubspec.lock: no advisories"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [osv-cargo.json, osv-pub.json]

# gitleaks over git history, config in .gitleaks.toml (default rules, no allowlist). On an MR it
# scans only the MR's commits; on main, tags and web runs, what HEAD, the remote branches and the
# tags reach (GIT_DEPTH 0: the diff base and the full scan both need every commit). Not `--all`:
# that also walks GitLab's hidden refs/merge-requests/* and refs/pipelines/*, which outlive a
# closed MR. Findings are redacted, so the report is safe to keep. Not scheduled: the image is
# pinned, so a weekly rerun would find nothing new.
secrets:
  stage: check
  rules: !reference [.not-scheduled, rules]
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [''] # the binary is gitleaks, on PATH
    pull_policy: if-not-present
  variables:
    GIT_DEPTH: 0
  cache: []
  before_script: []
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      range=""
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then range="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"; else range="HEAD --remotes --tags"; fi
      gitleaks git . --config .gitleaks.toml --log-opts="$range" --redact --no-banner --exit-code 1 --report-format json --report-path gitleaks.json
  artifacts:
    when: always
    expire_in: 30 days
    paths: [gitleaks.json]

# Validates renovate.json whenever it changes. --strict also fails on options Renovate would
# migrate. The image is the one the `renovate` job uses.
renovate-config:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes: [renovate.json]
  image:
    name: renovate/renovate:44@sha256:05c512c35c764ef6a179e69c3b30567eca254d67f13a0143479fe3c84852c67a
    entrypoint: ['']
    pull_policy: if-not-present
  cache: []
  before_script: []
  script:
    - renovate-config-validator --strict renovate.json

# Opens the dependency MRs per renovate.json. Only on the SCHEDULE=renovate pipeline schedule.
# RENOVATE_TOKEN (project access token, api + write_repository, role Developer) and GITHUB_COM_TOKEN
# (no permissions, for changelog lookups) are protected, masked variables scoped to the `renovate`
# environment, which only this job uses, so no job that runs cargo (and any build.rs) sees them.
# The image has no cargo or flutter: Renovate installs them on demand (containerbase, not rustup, so
# rust/rust-toolchain.toml is ignored) at the versions pinned in renovate.json `constraints`, which
# must equal rust/rust-toolchain.toml and .fvmrc (the toolchain bump moves all three). Its downloads
# and the crates index are cached under .ci/renovate for the slow network.
# Rewriting rust/Cargo.lock makes cargo fetch gogdl-lib, from its public GitHub mirror, so no key.
# Renovate exits 0 when it gives up on the repository (e.g. "Temporary error - aborting" for a token
# without Developer access), so the job also fails on that in its log (Lumen d9e4b54).
renovate:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "renovate"
  image:
    name: renovate/renovate:44@sha256:05c512c35c764ef6a179e69c3b30567eca254d67f13a0143479fe3c84852c67a
    entrypoint: ['']
    pull_policy: if-not-present
  # Variables scoped to the `renovate` environment reach only this job. `access` records no deployment.
  environment:
    name: renovate
    action: access
  cache:
    - key: renovate
      paths:
        - .ci/renovate/
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: 'false'
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_CACHE_DIR: $CI_PROJECT_DIR/.ci/renovate
    LOG_LEVEL: info
  script:
    - '[ -n "$RENOVATE_TOKEN" ] || { echo "RENOVATE_TOKEN is not set (protected, environment scope renovate)"; exit 1; }'
    # thinkcentre.home uses a private CA: the runner's tls-ca-file covers Node (Renovate) and git.
    - |
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then
        export NODE_EXTRA_CA_CERTS="$CI_SERVER_TLS_CA_FILE" GIT_SSL_CAINFO="$CI_SERVER_TLS_CA_FILE"
      fi
      { renovate 2>&1; echo $? > renovate.rc; } | tee renovate.log
      [ "$(cat renovate.rc)" = 0 ] || { echo "renovate exited $(cat renovate.rc)"; exit 1; }
      ! grep -Eq 'Temporary error|"result": "[a-z-]*error"|"exitCode": [1-9]' renovate.log \
        || { echo "renovate did not complete its repository (see the log above)"; exit 1; }

# tool/check_lockfile.sh fails on a package in example/pubspec.lock from outside pub.dev (or a path
# other than this bridge) before anything is fetched, and `pub get --enforce-lockfile` fails if that
# lock is stale or a package's hash changed. The root has no committed lock (it's a package).
dart:
  stage: check
  rules: !reference [.not-scheduled, rules]
  cache:
    - *cache-flutter
  before_script:
    - !reference [.toolchain, script]
  script:
    - sh tool/check_lockfile.sh
    - flutter pub get
    - flutter analyze --fatal-infos
    - cd example
    - flutter pub get --enforce-lockfile
    - flutter analyze --fatal-infos

# Regenerates the bindings and fails if anything differs. build_runner runs explicitly
# afterwards because codegen's own pass can delete the *.freezed.dart files without rewriting
# them (see Phase 4).
codegen:
  stage: check
  rules: !reference [.not-scheduled, rules]
  cache:
    - *cache-flutter
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.cargo-home, script]
    - !reference [.toolchain, script]
  script:
    - flutter pub get
    - flutter_rust_bridge_codegen generate
    - dart run build_runner build --delete-conflicting-outputs
    - git status --porcelain
    - git diff --exit-code
    - test -z "$(git status --porcelain)"

# Builds the example for Linux (the Native Assets build hook, hook/build.dart, runs cargo) and
# runs the integration test on a virtual display.
integration:
  stage: check
  rules: !reference [.not-scheduled, rules]
  cache:
    - *cache-flutter
    - *cache-cargo
    - *cache-hook-target
  before_script:
    - !reference [.cargo-home, script]
    - !reference [.toolchain, script]
  script:
    - sh tool/check_lockfile.sh
    - cd example
    - flutter pub get --enforce-lockfile
    - xvfb-run -a flutter test integration_test -d linux

# Runs after all check jobs, on vX.Y.Z tags only, and only for a commit on main: tags go on the
# merged release commit, never on a branch (README "CI and releases"). tool/release_notes.sh fails
# if pubspec.yaml, rust/Cargo.toml and the tag disagree, or if CHANGELOG.md has no section for the
# version, so a tag can't ship without matching versions and notes. tool/check_lib_pin.sh fails
# unless rust/Cargo.lock fetches gogdl-lib from its GitHub mirror and that mirror has the pinned tag at
# the locked SHA, so Lumen never pins a bridge tag that can't build. The release uses CI_JOB_TOKEN.
release:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
    pull_policy: if-not-present
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: # every check job
    - { job: rust, artifacts: false }
    - { job: dart, artifacts: false }
    - { job: codegen, artifacts: false }
    - { job: integration, artifacts: false }
    - { job: audit, artifacts: false }
    - { job: scan, artifacts: false }
    - { job: secrets, artifacts: false }
    - { job: renovate-config, artifacts: false, optional: true } # only exists when renovate.json changed
  variables:
    GIT_DEPTH: 0 # the ancestry check needs history
  cache: []
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # The git fetch below and glab, which creates the release, both talk to https://thinkcentre.home,
    # signed by a private CA the image doesn't trust. The runner hands that CA to jobs as
    # CI_SERVER_TLS_CA_FILE when its config.toml has tls-ca-file, so add it to the trust store (git
    # and Go both read this bundle) before the fetch: v1.3.1's release failed on it.
    - |
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then
        cat "$CI_SERVER_TLS_CA_FILE" >> /etc/ssl/certs/ca-certificates.crt
      else
        echo "warning: CI_SERVER_TLS_CA_FILE is not set; the fetch and the release will fail on the private CA unless the runner provides it" >&2
      fi
    - git fetch origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - |
      git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH" || {
        echo "$CI_COMMIT_TAG points at $CI_COMMIT_SHA, which is not on $CI_DEFAULT_BRANCH: tag the merged release commit" >&2
        exit 1
      }
    # Reads github.com, not this file, so after updating gogdl-lib's mirror a retry of this job passes.
    - sh tool/check_lib_pin.sh
    - sh tool/release_notes.sh "$CI_COMMIT_TAG" > release_notes.md
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release_notes.md
