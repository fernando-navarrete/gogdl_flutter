# CI/CD for gogdl_flutter. Runs on the self-hosted runner on thinkcentre.home (Docker
# executor), same setup as lumen's .gitlab-ci.yml. See devlog/v1.2.0-foundation.md (Phases 5
# and 6): the `check` stage gates everything, and the `release` stage publishes a GitLab
# release on vX.Y.Z tags.
#
# `gogdl-lib` is a private git dependency reachable only over the LAN
# (ssh://git@thinkcentre.home:2200). cargo fetches it through the git CLI
# (CARGO_NET_GIT_FETCH_WITH_CLI) so it can use the ssh-agent, which is loaded with a
# read-only deploy key stored base64-encoded (single line, no whitespace) as the
# `GOGDL_LIB_DEPLOY_KEY_B64` variable (Settings -> CI/CD -> Variables in this project,
# Type: Variable, masked, NOT protected: a protected variable comes through empty on
# unprotected branches). Its public half must be added as a deploy key on the gogdl-lib
# project.
#
# Jobs run in a prebuilt image (ci/Dockerfile: apt packages, the pinned rustup toolchain, the frb codegen
# and Flutter), so none of them touches apt, rustup or the Flutter clone: the network is slow
# and the runner is small. The runner shares the host's docker through its mounted docker.sock,
# so the image is built on the host with `ci/build-image.sh` and jobs see it directly. Rebuild
# it after bumping .fvmrc, rust/rust-toolchain.toml or the frb version, or after changing
# ci/Dockerfile with a bumped IMAGE_REVISION (update `image:` below to the printed name; the
# `.toolchain` check fails a job whose image has a stale Flutter or Rust). The runner's config.toml
# (volume `gitlab-runner-config`) must not force pulls, under [runners.docker]:
#   pull_policy = ["if-not-present"]
# (or allowed_pull_policies including it), then `docker service update --force gitlab-runner`.
#
# If a job fails to resolve thinkcentre.home, the runner's containers aren't seeing the LAN's
# /etc/hosts entry (it's a hosts-file entry, not real DNS). Fix it in
# /etc/gitlab-runner/config.toml under [runners.docker]:
#   extra_hosts = ["thinkcentre.home:192.168.8.234"]
# then restart the runner (`sudo gitlab-runner restart`).

# Pipelines run on merge requests, on main, on vX.Y.Z tags and on manual runs from the web UI
# (Build -> Pipelines -> Run pipeline, any branch). A branch with an open MR runs only the MR
# pipeline, and a pushed branch without an MR runs nothing. A scheduled pipeline runs only the jobs
# that name its SCHEDULE (`audit` on SCHEDULE=scan).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # the MR pipeline covers it: no duplicate branch pipeline
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - check
  - release

default:
  interruptible: true # with "Auto-cancel redundant pipelines" on, a new push cancels the older run
  image:
    name: gogdl-flutter-ci:flutter-3.47.2-rust-1.98.1-frb-2.13.0-r2
    pull_policy: if-not-present

# Everything that gets cached must live inside the project dir. The toolchains are in the image
# (/opt/cargo/bin, /opt/flutter/bin are on PATH); only the download caches are relocated here.
# CARGO_HOME only holds cargo's registry and git downloads here; the rustup proxies and the
# codegen binary are found through PATH, and the toolchain through the image's RUSTUP_HOME.
variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.ci/pub-cache"
  CARGO_HOME: "$CI_PROJECT_DIR/.ci/cargo"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

# SSH access to gogdl-lib via the base64-encoded deploy key variable.
.ssh:
  script:
    - mkdir -p ~/.ssh
    - echo "$GOGDL_LIB_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/gogdl_deploy_key
    - chmod 600 ~/.ssh/gogdl_deploy_key
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/gogdl_deploy_key
    - ssh-keyscan -p 2200 thinkcentre.home >> ~/.ssh/known_hosts 2>/dev/null
    # The Native Assets build hook runs cargo with a stripped environment (only HOME and PATH
    # get through), so the ssh-agent, CARGO_NET_GIT_FETCH_WITH_CLI, CARGO_HOME and RUSTUP_HOME
    # above don't reach it. Give it the same setup through files under ~ instead.
    - |
      cat > ~/.ssh/config <<EOF
      Host thinkcentre.home
        Port 2200
        IdentityFile ~/.ssh/gogdl_deploy_key
        IdentitiesOnly yes
      EOF
    - mkdir -p ~/.cargo "$CARGO_HOME/registry" "$CARGO_HOME/git"
    - printf '[net]\ngit-fetch-with-cli = true\n' > ~/.cargo/config.toml
    - ln -sfn "$CARGO_HOME/registry" ~/.cargo/registry
    - ln -sfn "$CARGO_HOME/git" ~/.cargo/git
    - ln -sfn /opt/rustup ~/.rustup

# Fails when the image's Flutter or Rust isn't the one pinned in .fvmrc / rust/rust-toolchain.toml,
# which would otherwise be tested against the old toolchain without any error (for Rust, the
# build hook would even download the pinned one on every run). (A literal block, not a plain
# list-item string: the sed script's `": *"` would otherwise parse as a YAML mapping value.)
.toolchain:
  script:
    - |
      want=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)
      have=$(cat /opt/flutter-version)
      if [ "$want" != "$have" ]; then
        echo "CI image has Flutter $have but .fvmrc pins $want: rebuild it with ci/build-image.sh and update image: in .gitlab-ci.yml" >&2
        exit 1
      fi
      want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust/rust-toolchain.toml)
      have=$(cat /opt/rust-version)
      if [ "$want" != "$have" ]; then
        echo "CI image has Rust $have but rust/rust-toolchain.toml pins $want: rebuild it with ci/build-image.sh and update image: in .gitlab-ci.yml" >&2
        exit 1
      fi
    - rustc --version
    - flutter --version

# Rules shared by the check jobs: everything except scheduled pipelines.
.not-scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.cache-flutter: &cache-flutter
  key:
    prefix: flutter
    files:
      - .fvmrc
      - pubspec.yaml
  paths:
    - .ci/pub-cache/

.cache-cargo: &cache-cargo
  key:
    prefix: cargo
    files:
      - rust/Cargo.lock
  paths:
    - .ci/cargo/registry/
    - .ci/cargo/git/

.cache-hook-target: &cache-hook-target
  key:
    prefix: hook-target
    files:
      - rust/Cargo.lock
  paths:
    - example/.dart_tool/hooks_runner/shared/gogdl_flutter/build/

.cache-target: &cache-target
  key:
    prefix: target-$CI_JOB_NAME
    files:
      - rust/Cargo.lock
  paths:
    - rust/target/

rust:
  stage: check
  rules: !reference [.not-scheduled, rules]
  cache:
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.ssh, script]
    - !reference [.toolchain, script]
  script:
    - cd rust
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked

# RustSec advisories, sources (crates.io plus gogdl-lib), licenses and duplicate versions, per
# rust/deny.toml. cargo-deny is baked into the image (ci/Dockerfile). It reads the metadata of every
# crate, so gogdl-lib is fetched over ssh. Its advisory database lands under CARGO_HOME, so it is
# cached; each run then fetches only the new advisories.
audit:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE == "scan"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  cache:
    - *cache-cargo
    - key: advisory-db
      paths:
        - .ci/cargo/advisory-dbs/
  before_script:
    - !reference [.ssh, script]
    - !reference [.toolchain, script]
  script:
    - cd rust
    - cargo deny --locked check

dart:
  stage: check
  rules: !reference [.not-scheduled, rules]
  cache:
    - *cache-flutter
  before_script:
    - !reference [.toolchain, script]
  script:
    - flutter pub get
    - flutter analyze --fatal-infos
    - cd example
    - flutter pub get
    - flutter analyze --fatal-infos

# Regenerates the bindings and fails if anything differs. build_runner runs explicitly
# afterwards because codegen's own pass can delete the *.freezed.dart files without rewriting
# them (see Phase 4).
codegen:
  stage: check
  rules: !reference [.not-scheduled, rules]
  cache:
    - *cache-flutter
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.ssh, script]
    - !reference [.toolchain, script]
  script:
    - flutter pub get
    - flutter_rust_bridge_codegen generate
    - dart run build_runner build --delete-conflicting-outputs
    - git status --porcelain
    - git diff --exit-code
    - test -z "$(git status --porcelain)"

# Builds the example for Linux (the Native Assets build hook, hook/build.dart, runs cargo) and
# runs the integration test on a virtual display.
integration:
  stage: check
  rules: !reference [.not-scheduled, rules]
  cache:
    - *cache-flutter
    - *cache-cargo
    - *cache-hook-target
  before_script:
    - !reference [.ssh, script]
    - !reference [.toolchain, script]
  script:
    - cd example
    - flutter pub get
    - xvfb-run -a flutter test integration_test -d linux

# Runs after all check jobs, on vX.Y.Z tags only, and only for a commit on main: tags go on the
# merged release commit, never on a branch (README "CI and releases"). tool/release_notes.sh fails
# if pubspec.yaml, rust/Cargo.toml and the tag disagree, or if CHANGELOG.md has no section for the
# version, so a tag can't ship without matching versions and notes. The release uses CI_JOB_TOKEN.
release:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
    pull_policy: if-not-present
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs: # every check job; MR 2 adds audit, scan and secrets
    - { job: rust, artifacts: false }
    - { job: dart, artifacts: false }
    - { job: codegen, artifacts: false }
    - { job: integration, artifacts: false }
  variables:
    GIT_DEPTH: 0 # the ancestry check needs history
  cache: []
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - |
      git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH" || {
        echo "$CI_COMMIT_TAG points at $CI_COMMIT_SHA, which is not on $CI_DEFAULT_BRANCH: tag the merged release commit" >&2
        exit 1
      }
    # glab, which creates the release, talks to https://thinkcentre.home, signed by a private CA
    # the image doesn't trust. The runner hands that CA to jobs as CI_SERVER_TLS_CA_FILE when
    # its config.toml has tls-ca-file, so add it to the trust store (Go reads this bundle).
    - |
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then
        cat "$CI_SERVER_TLS_CA_FILE" >> /etc/ssl/certs/ca-certificates.crt
      else
        echo "warning: CI_SERVER_TLS_CA_FILE is not set; creating the release will fail on the private CA unless the runner provides it" >&2
      fi
    - sh tool/release_notes.sh "$CI_COMMIT_TAG" > release_notes.md
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release_notes.md
