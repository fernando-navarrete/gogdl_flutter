# CI for gogdl_flutter. Runs on the self-hosted runner on thinkcentre.home (Docker
# executor), same setup as lumen's .gitlab-ci.yml. See v1.2.0-FOUNDATION.md Phase 5.
#
# `gogdl-lib` is a private git dependency reachable only over the LAN
# (ssh://git@thinkcentre.home:2200). cargo fetches it through the git CLI
# (CARGO_NET_GIT_FETCH_WITH_CLI) so it can use the ssh-agent, which is loaded with a
# read-only deploy key stored base64-encoded (single line, no whitespace) as the
# `GOGDL_LIB_DEPLOY_KEY_B64` variable (Settings -> CI/CD -> Variables in this project,
# Type: Variable, masked, NOT protected: a protected variable comes through empty on
# unprotected branches). Its public half must be added as a deploy key on the gogdl-lib
# project.
#
# If a job fails to resolve thinkcentre.home, the runner's containers aren't seeing the LAN's
# /etc/hosts entry (it's a hosts-file entry, not real DNS). Fix it in
# /etc/gitlab-runner/config.toml under [runners.docker]:
#   extra_hosts = ["thinkcentre.home:192.168.8.234"]
# then restart the runner (`sudo gitlab-runner restart`).

# Pipelines run only for tag pushes (e.g. v1.2.0) and for manual runs from the web UI
# (Build -> Pipelines -> Run pipeline) on any branch, to keep load off the self-hosted runner.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check

default:
  image: debian:bookworm-slim

# Everything that gets cached must live inside the project dir, so cargo and rustup are
# relocated under .ci/ as well.
variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.ci/pub-cache"
  FLUTTER_HOME: "$CI_PROJECT_DIR/.ci/flutter"
  RUSTUP_HOME: "$CI_PROJECT_DIR/.ci/rustup"
  CARGO_HOME: "$CI_PROJECT_DIR/.ci/cargo"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

.apt:
  script:
    - apt-get update -qq
    # build-essential/cmake/pkg-config: aws-lc-sys and friends. EXTRA_PACKAGES is per job.
    - apt-get install -qq -y --no-install-recommends git curl unzip xz-utils ca-certificates openssh-client build-essential cmake pkg-config $EXTRA_PACKAGES >/dev/null

# SSH access to gogdl-lib via the base64-encoded deploy key variable.
.ssh:
  script:
    - mkdir -p ~/.ssh
    - echo "$GOGDL_LIB_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/gogdl_deploy_key
    - chmod 600 ~/.ssh/gogdl_deploy_key
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/gogdl_deploy_key
    - ssh-keyscan -p 2200 thinkcentre.home >> ~/.ssh/known_hosts 2>/dev/null

# Rust via rustup, installed only if missing from the cache. The toolchain must be called
# `stable`: cargokit asks rustup for `stable` when building the plugin, and would download a
# second toolchain if it were installed under another name.
.rust:
  script:
    - |
      if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
        curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable -c rustfmt -c clippy
      fi
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustc --version

# Flutter, pinned to the version in .fvmrc; cached in .ci/flutter/.
# (A literal block, not a plain list-item string: the sed script's `": *"`
# would otherwise parse as a YAML mapping value followed by an alias.)
.flutter:
  script:
    - |
      FLUTTER_VERSION=$(sed -n 's/.*"flutter": *"\([^"]*\)".*/\1/p' .fvmrc)
      if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
        git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_HOME"
      fi
    - export PATH="$FLUTTER_HOME/bin:$PATH"
    - flutter config --no-analytics >/dev/null
    - flutter --version

.cache-flutter: &cache-flutter
  key:
    prefix: flutter
    files:
      - .fvmrc
      - pubspec.yaml
  paths:
    - .ci/flutter/
    - .ci/pub-cache/

.cache-cargo: &cache-cargo
  key:
    prefix: cargo
    files:
      - rust/Cargo.lock
  paths:
    - .ci/rustup/
    - .ci/cargo/

.cache-target: &cache-target
  key:
    prefix: target-$CI_JOB_NAME
    files:
      - rust/Cargo.lock
  paths:
    - rust/target/

rust:
  stage: check
  variables:
    EXTRA_PACKAGES: ""
  cache:
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.apt, script]
    - !reference [.ssh, script]
    - !reference [.rust, script]
  script:
    - cd rust
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked

dart:
  stage: check
  variables:
    EXTRA_PACKAGES: ""
  cache:
    - *cache-flutter
  before_script:
    - !reference [.apt, script]
    - !reference [.flutter, script]
  script:
    - flutter pub get
    - flutter analyze --fatal-infos
    - cd example
    - flutter pub get
    - flutter analyze --fatal-infos

# Regenerates the bindings and fails if anything differs. build_runner runs explicitly
# afterwards because codegen's own pass can delete the *.freezed.dart files without rewriting
# them (see Phase 4).
codegen:
  stage: check
  variables:
    EXTRA_PACKAGES: ""
  cache:
    - *cache-flutter
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.apt, script]
    - !reference [.ssh, script]
    - !reference [.rust, script]
    - !reference [.flutter, script]
  script:
    - flutter pub get
    - cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
    - flutter_rust_bridge_codegen generate
    - dart run build_runner build --delete-conflicting-outputs
    - git status --porcelain
    - git diff --exit-code
    - test -z "$(git status --porcelain)"

# Builds the example for Linux (cargokit compiles the plugin) and runs the integration test
# on a virtual display.
integration:
  stage: check
  variables:
    EXTRA_PACKAGES: "clang ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb xauth"
  cache:
    - *cache-flutter
    - *cache-cargo
  before_script:
    - !reference [.apt, script]
    - !reference [.ssh, script]
    - !reference [.rust, script]
    - !reference [.flutter, script]
  script:
    - cd example
    - flutter pub get
    - xvfb-run -a flutter test integration_test -d linux
