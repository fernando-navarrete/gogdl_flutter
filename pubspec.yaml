name: gogdl_flutter
description: "Dart bindings (flutter_rust_bridge) for gogdl-lib: GOG login, library, game and Proton downloads, repair and cloud saves. Used by Lumen."
version: 1.4.3
repository: https://github.com/fernando-navarrete/gogdl_flutter
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
