[package]
name = "gogdl_flutter"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
futures = "0.3.32"
gogdl-lib = { git = "ssh://git@thinkcentre.home:2200/gogdl/gogdl-lib.git", tag = "v0.1.1", version = "0.1.1" }
thiserror = "2.0.18"
tokio = "1.52.3"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
