[package]
name = "gogdl_flutter"
version = "1.3.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
gogdl-lib = { git = "ssh://git@thinkcentre.home:2200/gogdl/gogdl-lib.git", tag = "v1.2.3", version = "1.2.3" }
futures-util = "0.3.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
