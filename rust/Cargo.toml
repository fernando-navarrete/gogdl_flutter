[package]
name = "gogdl_flutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
futures = "0.3.32"
gogdl-lib2 = { version = "0.1.0", path = "../../gogdl-lib2", package = "gogdl-lib" }
thiserror = "2.0.18"
tokio = "1.52.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
