[package]
name = "gogdl_flutter"
version = "1.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "flutter_rust_bridge bindings for gogdl-lib, built into Lumen through Native Assets"
repository = "https://github.com/fernando-navarrete/gogdl_flutter"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
gogdl-lib = { git = "https://github.com/fernando-navarrete/gogdl-lib.git", tag = "v1.4.3", version = "1.4.3" }
futures-util = "0.3.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
