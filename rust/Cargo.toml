[package]
name = "gogdl_flutter"
version = "1.2.2"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
gogdl-lib = { git = "ssh://git@thinkcentre.home:2200/gogdl/gogdl-lib.git", tag = "v1.0.11", version = "1.0.11" }
futures-util = "0.3.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
